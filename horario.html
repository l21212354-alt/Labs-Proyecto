<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horario</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            min-height: 100vh;
            background: #38b6f1;
            font-family: 'Segoe UI', Arial, sans-serif;
        }
        nav {
            background: #a3a3a3;
            display: flex;
            gap: 40px;
            padding: 18px 32px;
        }
        nav a {
                color: #fff;
                text-decoration: none;
                font-size: 22px;
                cursor: pointer;
        }
        nav a.active {
                    font-weight: 800;
                    text-decoration: underline;
        }
        .content {
            max-width: 1200px;
            margin: 24px auto;
            background: #fff;
            border-radius: 20px;
            padding: 24px;
        }
        .empty-banner {
            background: #a3a3a3;
            color: #fff;
            text-align: center;
            border-radius: 14px;
            padding: 16px;
            font-size: 18px;
            margin-bottom: 20px;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
            gap: 24px;
        }
        .lab-box {
            background: #ccd2da;
            border-radius: 10px;
            padding: 40px 10px;
            text-align: center;
            font-size: 18px;
            cursor: pointer;
            border: none;
            transition: background 0.15s;
        }
        .lab-box:hover {
                background: #b7bfc9;
        }
</style>
</head>
<body>

    <nav>
        <a class="active">Horario</a>
        <a id="navRegistrar" href="registrar-datos.html">Registrar datos</a>
        <a href="reporte.html">Reporte</a>
        <a id="navSalir">Salir</a>
    </nav>

    <div class="content">
        <div class="empty-banner" id="emptyBanner" style="display:none;">
            Sin laboratorios registrados
        </div>
        <div class="grid" id="labGrid"></div>
    </div>

<script>
    // Guardia de sesión
    const rol = sessionStorage.getItem('rol');
    const usuario = sessionStorage.getItem('usuario');

    if (!usuario || !rol) {
        window.location.href = '/index.html';
    }

    // Visualizador no tiene acceso a Registrar datos
    if (rol === 'Visualizador') {
        document.getElementById('navRegistrar').style.display = 'none';
    }

    document.getElementById('navSalir').addEventListener('click', () => {
        sessionStorage.clear();
        window.location.href = '/index.html';
    });

    async function cargarLaboratorios() {
        const grid = document.getElementById('labGrid');
        const emptyBanner = document.getElementById('emptyBanner');

        try {
            const response = await fetch('/api/Laboratorios');
            if (!response.ok) throw new Error('Error al cargar laboratorios');

            const laboratorios = await response.json();

            if (laboratorios.length === 0) {
                emptyBanner.style.display = 'block';
                return;
            }

            laboratorios.forEach(lab => {
                const box = document.createElement('button');
                box.className = 'lab-box';
                box.textContent = lab.codigo;
                box.addEventListener('click', () => {
                    window.location.href = `horario-detalle.html?id=${lab.id}&codigo=${encodeURIComponent(lab.codigo)}`;
                });
                grid.appendChild(box);
            });
        } catch (err) {
            emptyBanner.textContent = 'No se pudo conectar con el servidor.';
            emptyBanner.style.display = 'block';
        }
    }
    cargarLaboratorios();
</script>

</body>
</html>
